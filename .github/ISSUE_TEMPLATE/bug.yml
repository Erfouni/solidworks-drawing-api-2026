name: Query or data bug
description: Report a reproducible query, artifact, or source-mapping problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve a source-traceable engineering database.
  - type: input
    id: command
    attributes:
      label: Reproduction command or SQL
      placeholder: python scripts/query_solidworks_drawing_api_db.py --symbol IDrawingDoc::...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source URL, if applicable
      placeholder: https://help.solidworks.com/2026/english/api/...
  - type: dropdown
    id: sensitive
    attributes:
      label: Does the report contain customer/private engineering data?
      options:
        - "No"
        - "Yes — I will remove it before submitting"
    validations:
      required: true
